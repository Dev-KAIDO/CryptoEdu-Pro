<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" role="img" aria-labelledby="title desc"><title id="title">CryptoEdu Pro feature icons</title><desc id="desc">Four compact icons for bilingual learning, classical ciphers, modern cryptography, and code analysis.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e1edf2"/></pattern></defs><rect width="1000" height="175" rx="22" fill="#f7fbff"/><rect width="1000" height="175" rx="22" fill="url(#grid)"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><circle cx="125" cy="68" r="35" fill="#e0f2fe" stroke="#0f4c81" stroke-width="3"/><text x="125" y="76" fill="#075985" font-size="22" font-weight="700">AR</text><text x="125" y="130" fill="#0b3558" font-size="14" font-weight="700">BILINGUAL</text><text x="125" y="149" fill="#627d98" font-size="11">Arabic + English</text></g><g><circle cx="375" cy="68" r="35" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><path d="M357 73c15-28 32-28 37 0-5 28-22 28-37 0z" fill="none" stroke="#115e59" stroke-width="4"/><path d="M375 53v30M360 68h30" stroke="#115e59" stroke-width="3"/><text x="375" y="130" fill="#0b3558" font-size="14" font-weight="700">CLASSICAL</text><text x="375" y="149" fill="#627d98" font-size="11">learn the foundations</text></g><g><circle cx="625" cy="68" r="35" fill="#e0e7ff" stroke="#2563eb" stroke-width="3"/><path d="M625 46l20 11v22l-20 13-20-13V57z" fill="#fff" stroke="#2563eb" stroke-width="3"/><path d="M625 57v22M605 57l20 11 20-11" fill="none" stroke="#2563eb" stroke-width="3"/><text x="625" y="130" fill="#0b3558" font-size="14" font-weight="700">MODERN</text><text x="625" y="149" fill="#627d98" font-size="11">RSA · DH · DES</text></g><g><circle cx="875" cy="68" r="35" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><path d="M855 83V53h40v30M862 65h26M862 74h18" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/><text x="875" y="130"