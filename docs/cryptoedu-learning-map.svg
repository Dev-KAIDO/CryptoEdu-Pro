<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 310" role="img" aria-labelledby="title desc"><title id="title">CryptoEdu Pro learning path</title><desc id="desc">A five-step learning path from choosing a cipher to comparing code, math, and output.</desc><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#e1edf2"/></pattern><linearGradient id="line" x1="0" x2="1"><stop stop-color="#0f4c81"/><stop offset=".5" stop-color="#0f766e"/><stop offset="1" stop-color="#d97706"/></linearGradient></defs><rect width="1400" height="310" rx="24" fill="#f7fbff"/><rect width="1400" height="310" rx="24" fill="url(#grid)"/><text x="50" y="48" fill="#0b3558" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Learn the cipher, not just the ciphertext</text><text x="50" y="76" fill="#627d98" font-family="Arial,Helvetica,sans-serif" font-size="14">A guided path from experiment to explanation — in Arabic or English.</text><path d="M128 166H1270" stroke="#c5d9e4" stroke-width="5" stroke-linecap="round"/><path d="M128 166H1270" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g><circle cx="128" cy="166" r="32" fill="#e0f2fe" stroke="#0f4c81" stroke-width="3"/><text x="128" y="172" fill="#075985" font-size="16" font-weight="700">01</text><rect x="54" y="213" width="148" height="58" rx="13" fill="#fff" stroke="#b7d1df"/><text x="128" y="237" fill="#0b3558" font-size="14" font-weight="700">CHOOSE</text><text x="128" y="256" fill="#627d98" font-size="11">an algorithm</text></g><g><circle cx="413" cy="166" r="32" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="413" y="172" fill="#115e59" font-size="16" font-weight="700">02</text><rect x="339" y="213" width="148" height="58" rx="13" fill="#fff" stroke="#b7d1df"/><text x="413" y="237" fill="#0b3558" font-size="14" font-weight="700">EXPERIMENT</text><text x="413" y="256" fill="#627d98" font-size="11">text + key</text></g><g><circle cx="698" cy="166" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="698" y="172" fill="#b45309" font-size="16" font-weight="700">03</text><rect x="624" y="213" width="148" height="58" rx="13" fill="#fff" stroke="#b7d1df"/><text x="698" y="237" fill="#0b3558" font-size="14" font-weight="700">ANALYZE</text><text x="698" y="256" fill="#627d98" font-size="11">steps + formulas</text></g><g><circle cx="983" cy="166" r="32" fill="#e0e7ff" stroke="#2563eb" stroke-width="3"/><text x="983" y="172" fill="#1d4ed8" font-size="16" font-weight="700">04</text><rect x="909" y="213" width="148" height="58" rx="13" fill="#fff" stroke="#b7d1df"/><text x="983" y="237" fill="#0b3558" font-size="14" font-weight="700">COMPARE</text><text x="983" y="256" fill="#627d98" font-size="11">code + result</text></g><g><circle cx="1268" cy="166" r="32" fill="#fce7f3" stroke="#be185d" stroke-width="3"/><text x="1268" y="172" fill="#9d174d" font-size="16" font-weight="700">05</text><rect x="1194" y="213" width="148" height="58" rx="13" fill="#fff" stroke="#b7d1df"/><text x="1268" y="237" fill="#0b3558" font-size="14" font-weight="700">REFLECT</text><text x="1268" y="256" fill="#627d98" font-size="11">limitations + safety</text></g></g></svg>
