[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoedu-pro"
version = "0.1.0"
description = "Interactive bilingual desktop app for learning classical and modern cryptography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "pyperclip",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"tools/legacy/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
