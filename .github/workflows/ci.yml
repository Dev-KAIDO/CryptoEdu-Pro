name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system GUI dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-tk xvfb

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff

      - name: Ruff
        run: ruff check .

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: UI smoke test
        run: xvfb-run --auto-servernum python -m unittest tests.test_ui_smoke -v

  package:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system GUI dependencies
        run: sudo apt-get update && sudo apt-get install --yes python3-tk

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build PyInstaller package
        run: pyinstaller --clean --noconfirm CryptoEdu.spec
